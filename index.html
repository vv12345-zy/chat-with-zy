<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soft Cove + 真人喘息</title>
<style>
body{margin:0;background:#0f0f10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{width:min(92vw,520px);padding:24px}.card{background:#1c1c1e;border-radius:22px;padding:22px;box-shadow:0 12px 50px #0006}
h1{font-size:24px;margin:0 0 8px}.sub{opacity:.68;font-size:14px;line-height:1.55;margin-bottom:18px}
button{width:100%;border:0;border-radius:999px;padding:16px 18px;font-size:17px;font-weight:700;background:#fff;color:#111;margin:8px 0}
.status{font-size:13px;opacity:.78;min-height:38px;margin-top:10px;line-height:1.45}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>陆泽阳 · 真人喘息 + Soft Cove</h1>
<div class="sub">真人 sigh → 你之前最喜欢的 Soft Cove「别抖。放松。」</div>
<button id="play">▶︎ 播放合成试听</button>
<div class="status" id="status">CosyVoice 现在已恢复，点一下直接听。</div>
</div></div>
<script>
const SIGH='https://cdn.freesound.org/previews/799/799579_16968183-hq.mp3';
const VOICE='https://yanyan-phone.vercel.app/api/cosy-result?voice=1';
let current=[],busy=false;
const $=id=>document.getElementById(id);
function stopAll(){for(const a of current){try{a.pause()}catch{}}current=[];busy=false;$('play').textContent='▶︎ 再听一次'}
$('play').onclick=async()=>{
 if(busy){stopAll();$('status').textContent='已停止';return}
 busy=true;$('play').textContent='■ 停止';$('status').textContent='加载中…';
 try{
   const [vr]=await Promise.all([fetch(VOICE,{cache:'no-store'})]);
   if(!vr.ok) throw new Error('Soft Cove '+vr.status);
   const vb=await vr.blob();
   if(vb.size<1000) throw new Error('Soft Cove 空音频');
   const voiceUrl=URL.createObjectURL(vb);
   const a=new Audio(SIGH),v=new Audio(voiceUrl);current=[a,v];a.volume=.82;v.volume=1;
   let switched=false;
   a.currentTime=0;
   a.ontimeupdate=()=>{
     if(!switched && a.currentTime>=1.5){
       switched=true;a.pause();
       setTimeout(()=>{if(!busy)return;$('status').textContent='Soft Cove…';v.play().catch(e=>{$('status').textContent='Cove 播放失败：'+e.message;stopAll()})},100)
     }
   };
   a.onerror=()=>{$('status').textContent='喘息素材加载失败';URL.revokeObjectURL(voiceUrl);stopAll()};
   v.onerror=()=>{$('status').textContent='Soft Cove 音频加载失败';URL.revokeObjectURL(voiceUrl);stopAll()};
   v.onended=()=>{URL.revokeObjectURL(voiceUrl);$('status').textContent='播放完成';stopAll()};
   await a.play();$('status').textContent='真人喘息…';
 }catch(e){$('status').textContent='加载失败：'+e.message;stopAll()}
};
</script></body></html>
