<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>陆泽阳语音试听</title>
<style>
body{margin:0;background:#0f0f10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{width:min(92vw,520px);padding:24px}.card{background:#1c1c1e;border-radius:22px;padding:22px;box-shadow:0 12px 50px #0006}
h1{font-size:24px;margin:0 0 8px}.sub{opacity:.67;font-size:14px;line-height:1.55;margin-bottom:18px}
button{width:100%;border:0;border-radius:999px;padding:16px 18px;font-size:17px;font-weight:700;background:#fff;color:#111;margin:8px 0}
button.secondary{background:#2c2c2e;color:#fff}.status{font-size:13px;opacity:.7;min-height:20px;margin-top:10px}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>陆泽阳 · 喘息 + Soft Cove</h1>
<div class="sub">Heavy breath male 真人喘息 → Soft Cove「别抖。放松。」</div>
<button id="heavy">▶︎ Heavy breath + Soft Cove</button>
<button id="stu" class="secondary">▶︎ StuieStu 原页试听</button>
<div class="status" id="status">点第一个直接听合成版。</div>
</div></div>
<script>
const heavy='https://cdn.freesound.org/previews/538/538870_11658457-hq.mp3';
const voice='https://yanyan-phone.vercel.app/api/cosy-result?voice=1';
let a=null,v=null,busy=false;
function stop(){if(a){a.pause();a=null}if(v){v.pause();v=null}busy=false;document.getElementById('heavy').textContent='▶︎ Heavy breath + Soft Cove'}
document.getElementById('heavy').onclick=async()=>{
 const b=document.getElementById('heavy'),s=document.getElementById('status');
 if(busy){stop();s.textContent='已停止';return}
 busy=true;b.textContent='■ 停止';s.textContent='加载中…';
 try{
  a=new Audio(heavy);v=new Audio(voice);a.volume=.82;v.volume=1;
  a.currentTime=2.2;let switched=false;
  a.ontimeupdate=()=>{if(!switched&&a.currentTime>=4.0){switched=true;a.pause();setTimeout(()=>{if(!busy)return;s.textContent='Soft Cove…';v.play().catch(e=>{s.textContent='Cove 播放失败：'+e.message;stop()})},90)}};
  a.onerror=()=>{s.textContent='喘息素材加载失败';stop()};
  v.onerror=()=>{s.textContent='Soft Cove 暂时不可用';stop()};
  v.onended=()=>{s.textContent='播放完成';stop()};
  await a.play();s.textContent='Heavy breath male…';
 }catch(e){s.textContent='播放失败：'+e.message;stop()}
};
document.getElementById('stu').onclick=()=>window.open('https://pixabay.com/sound-effects/people-male-hyperventilating-panicked-breathing-457557/','_blank');
</script></body></html>
