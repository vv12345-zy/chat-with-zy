<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>陆泽阳语音试听</title>
<style>
body{margin:0;background:#0f0f10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{width:min(92vw,520px);padding:24px}.card{background:#1c1c1e;border-radius:22px;padding:22px;box-shadow:0 12px 50px #0006}
h1{font-size:24px;margin:0 0 8px}.sub{opacity:.68;font-size:14px;line-height:1.55;margin-bottom:18px}
button{width:100%;border:0;border-radius:999px;padding:16px 18px;font-size:17px;font-weight:700;background:#fff;color:#111;margin:8px 0}
.status{font-size:13px;opacity:.78;min-height:38px;margin-top:10px;line-height:1.45}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>陆泽阳 · 当前小手机语音</h1>
<div class="sub">真人 sigh → 小手机现在用的 Qwen3-TTS Cove clone「别抖。放松。」</div>
<button id="play">▶︎ 播放试听</button>
<div class="status" id="status">这次已经完全不用 Soft Cove / CosyVoice。</div>
</div></div>
<script>
const SPACE='https://qwen-qwen3-tts.hf.space';
const REF='https://huggingface.co/MoYoYoTech/tone-models/resolve/main/ref_audios/cove_ref.wav';
const REF_TEXT='and he has a long career in the Senate representing Delaware. So both have had significant impacts on American politics and policies.';
const SIGH='https://cdn.freesound.org/previews/799/799579_16968183-hq.mp3';
let current=[],busy=false;
const $=id=>document.getElementById(id);
function stopAll(){for(const a of current){try{a.pause()}catch{}}current=[];busy=false;$('play').textContent='▶︎ 再听一次'}
async function makeVoice(){
 $('status').textContent='正在生成小手机当前 Cove…';
 const ref={path:REF,url:REF,orig_name:'cove_ref.wav',meta:{_type:'gradio.FileData'}};
 const st=await fetch(SPACE+'/gradio_api/call/generate_voice_clone',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:[ref,REF_TEXT,'别抖。放松。','Chinese',false,'1.7B']})});
 if(!st.ok)throw new Error('生成启动失败 '+st.status);
 const q=await st.json();if(!q.event_id)throw new Error('没有 event id');
 const ev=await fetch(SPACE+'/gradio_api/call/generate_voice_clone/'+encodeURIComponent(q.event_id));
 const raw=await ev.text();if(/event:\s*error/i.test(raw))throw new Error('Qwen 生成失败');
 let payload=null;
 for(const line of raw.split(/\r?\n/)){if(line.startsWith('data:')){try{payload=JSON.parse(line.slice(5).trim())}catch{}}}
 const f=Array.isArray(payload)?payload[0]:null;const u=f&&typeof f==='object'&&(f.url||f.path);
 if(!u)throw new Error('没有返回音频');
 return /^https?:\/\//.test(u)?u:(u.startsWith('/')?SPACE+u:SPACE+'/gradio_api/file='+encodeURIComponent(u));
}
$('play').onclick=async()=>{
 if(busy){stopAll();$('status').textContent='已停止';return}
 busy=true;$('play').textContent='■ 停止';
 try{
  const voiceUrl=await makeVoice();
  $('status').textContent='生成好了，开始播放…';
  const a=new Audio(SIGH),v=new Audio(voiceUrl);current=[a,v];a.volume=.8;v.volume=1;
  a.onended=()=>setTimeout(()=>v.play(),80);
  a.onerror=()=>{$('status').textContent='喘息素材加载失败';stopAll()};
  v.onerror=()=>{$('status').textContent='当前小手机 Cove 音频加载失败';stopAll()};
  v.onended=()=>{$('status').textContent='播放完成';stopAll()};
  await a.play();
 }catch(e){$('status').textContent='生成失败：'+e.message;stopAll()}
};
</script></body></html>
