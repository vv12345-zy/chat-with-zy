<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>结合版试听</title>
<style>body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(88vw,430px);background:#1d1d1f;border-radius:22px;padding:22px}.sub{opacity:.7;line-height:1.5;font-size:14px}button{width:100%;border:0;border-radius:999px;padding:16px;font-size:17px;font-weight:700;margin-top:14px}.st{opacity:.72;font-size:13px;margin-top:12px;min-height:20px}</style></head>
<body><div class="card"><h2>真人喘息 + Soft Cove</h2><div class="sub">真人男声喘息 → Soft Cove「别抖。放松。」</div><button id="p">▶︎ 播放结合版</button><div class="st" id="s">点一下就按顺序连着播。</div></div>
<script>
const BREATH='https://cdn.freesound.org/previews/799/799579_16968183-hq.mp3';
const COVE='https://yanyan-phone.vercel.app/api/cosy-result?voice=1';
let a,v,busy=false,vu='';
function stop(){try{a&&a.pause()}catch{}try{v&&v.pause()}catch{}if(vu)try{URL.revokeObjectURL(vu)}catch{}a=v=null;vu='';busy=false;p.textContent='▶︎ 再听一次'}
p.onclick=async()=>{if(busy){stop();s.textContent='已停止';return}busy=true;p.textContent='加载中…';s.textContent='正在生成 Soft Cove…';
try{
 const r=await fetch(COVE,{cache:'no-store'});if(!r.ok)throw new Error('Soft Cove '+r.status);
 const blob=await r.blob();vu=URL.createObjectURL(blob);
 a=new Audio(BREATH);v=new Audio(vu);a.volume=.78;v.volume=1;
 a.currentTime=0;
 a.onloadedmetadata=()=>{try{a.currentTime=.15}catch{}};
 let moved=false;
 a.ontimeupdate=()=>{if(!moved&&a.currentTime>=1.7){moved=true;a.pause();s.textContent='Soft Cove…';setTimeout(()=>v.play().catch(e=>{s.textContent='Cove 播放失败';stop()}),90)}};
 a.onerror=()=>{s.textContent='喘息加载失败';stop()};
 v.onerror=()=>{s.textContent='Soft Cove 播放失败';stop()};
 v.onended=()=>{s.textContent='播放完成';stop()};
 await a.play();p.textContent='■ 停止';s.textContent='真人喘息…';
}catch(e){s.textContent='失败：'+e.message;stop()}
};
</script></body></html>
