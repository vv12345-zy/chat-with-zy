<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>中文男声三版试听</title>
<style>
body{margin:0;background:#0f0f10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.wrap{width:min(92vw,560px);margin:auto;padding:28px 0 48px}.card{background:#1c1c1e;border-radius:22px;padding:22px;box-shadow:0 12px 50px #0006}
h1{font-size:24px;margin:0 0 8px}.sub{opacity:.7;font-size:14px;line-height:1.55;margin-bottom:18px}
button{width:100%;border:0;border-radius:999px;padding:15px 18px;font-size:16px;font-weight:700;background:#fff;color:#111;margin:7px 0}
button.alt{background:#2c2c2e;color:#fff}.row{margin:14px 0;padding:14px;border-radius:16px;background:#252527}.row b{display:block;margin-bottom:8px}.status{font-size:13px;opacity:.76;min-height:34px;margin-top:8px;line-height:1.45}small{opacity:.62;line-height:1.45;display:block}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>中文男声 · 三版</h1>
<div class="sub">刚才“两步克隆”会失败，所以我换成 Qwen 原生 Voice Design：直接生成<strong>自然普通话男声</strong>，重点压掉外国人口音，再尽量往 Cove 的低沉、柔软、贴耳感靠。</div>
<button id="gen">生成 3 个候选</button>
<div id="rows"></div>
<div class="status" id="status">这次每版只生成一次，稳定很多。</div>
</div></div>
<script>
const SPACE='https://qwen-qwen3-tts.hf.space';
const END='generate_voice_design';
const TEXT='别抖。放松。';
const DESCS=[
 'A young adult male native Mandarin Chinese speaker. Warm low-pitched voice, soft and intimate, close-mic, calm, gentle, slightly breathy, natural Beijing-neutral Mandarin pronunciation, no foreign accent, no exaggerated acting.',
 'A native Mandarin Chinese male in his mid twenties. Deep but not overly bassy, tender, quiet, emotionally warm, close and private speaking style, smooth natural Chinese rhythm and pronunciation, no foreign accent.',
 'A young native Chinese man speaking Mandarin very naturally. Soft low voice, relaxed, restrained, affectionate, slightly husky, close-microphone feeling, slow and gentle delivery, standard Mandarin, absolutely no foreign accent.'
];
const $=id=>document.getElementById(id);

async function call(desc){
 const st=await fetch(SPACE+'/gradio_api/call/'+END,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:[TEXT,'Chinese',desc]})});
 if(!st.ok) throw new Error('start '+st.status);
 const q=await st.json(); if(!q.event_id) throw new Error('no event id');
 const ev=await fetch(SPACE+'/gradio_api/call/'+END+'/'+encodeURIComponent(q.event_id));
 const raw=await ev.text();
 if(/event:\s*error/i.test(raw)) throw new Error('generation failed');
 let payload=null;
 for(const line of raw.split(/\r?\n/)){if(line.startsWith('data:')){try{payload=JSON.parse(line.slice(5).trim())}catch{}}}
 const f=Array.isArray(payload)?payload[0]:null;
 const u=f&&typeof f==='object'&&(f.url||f.path);
 if(!u) throw new Error('no audio returned');
 return /^https?:\/\//.test(u)?u:(u.startsWith('/')?SPACE+u:SPACE+'/gradio_api/file='+encodeURIComponent(u));
}

async function one(i){
 const box=document.getElementById('r'+i), st=box.querySelector('.st'), btn=box.querySelector('button');
 btn.disabled=true; btn.textContent='生成中…';
 try{
   st.textContent='正在生成候选 '+(i+1)+'…';
   const out=await call(DESCS[i]);
   btn.disabled=false; btn.textContent='▶︎ 播放候选 '+(i+1);
   btn.onclick=()=>new Audio(out).play();
   st.textContent='完成。重点听：普通话自然度、音色、亲密感。';
 }catch(e){
   btn.disabled=false; btn.textContent='重试候选 '+(i+1); btn.onclick=()=>one(i);
   st.textContent='失败：'+e.message;
 }
}
function build(){
 $('rows').innerHTML=DESCS.map((d,i)=>`<div class="row" id="r${i}"><b>候选 ${i+1}</b><small>${i===0?'偏温柔低沉':i===1?'偏亲密自然':'偏轻哑贴耳'}</small><button class="alt" disabled>等待生成</button><div class="st status"></div></div>`).join('');
}
$('gen').onclick=async()=>{
 $('gen').disabled=true;build();$('status').textContent='开始生成，按顺序一版一版来。';
 for(let i=0;i<3;i++) await one(i);
 $('gen').disabled=false;$('status').textContent='听完直接告诉我 1 / 2 / 3 哪个最像你想要的。';
};
</script></body></html>
